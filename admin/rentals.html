<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Rentals</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #FFF7EA; color: #1B2B22; margin: 0; padding: 20px; }
    h1, h2 { color: #1F4D3A; margin-top: 0; }
    .hidden { display: none !important; }
    .nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav a { padding: 10px 16px; border-radius: 999px; border: 1.5px solid #1F4D3A; color: #1F4D3A; text-decoration: none; font-weight: 700; }
    .nav a.active { background: #1F4D3A; color: #fff; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
    input { height: 46px; border: 1.5px solid #B8AD96; border-radius: 10px; padding: 0 12px; font-size: 15px; background: #fff; }
    .btn { height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: #1F4D3A; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn.orange { background: #C2410C; }
    .btn.line { background: transparent; border: 1.5px solid #1F4D3A; color: #1F4D3A; }
    .btn.danger { background: transparent; border: 1.5px solid #9A3412; color: #9A3412; }
    .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .list { flex: 1; min-width: 320px; background: #fff; border-radius: 18px; padding: 8px 16px; }
    .form { width: 320px; background: #fff; border-radius: 18px; padding: 20px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F0E6D2; flex-wrap: wrap; }
    .row:last-child { border-bottom: 0; }
    .row img, .row .ph { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #F8D9A0; }
    .info { flex: 1; min-width: 120px; }
    .info small { color: #5B5346; }
    .msg { color: #9A3412; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>

  <div id="needLogin" class="hidden">
    <p>Please <a href="index.html">log in</a> first.</p>
  </div>

  <div id="dashView" class="hidden">
    <div class="nav">
      <a href="index.html">Items</a>
      <a href="rentals.html" class="active">Rentals</a>
      <a href="bookings.html">Bookings</a>
      <a href="../index.html">View shop</a>
    </div>
    <h1>Rentals</h1>
    <div class="layout">
      <div class="list" id="list">Loading...</div>

      <div class="form">
        <h2 id="formTitle">Add rental</h2>
        <label>Name <input type="text" id="name" placeholder="e.g. Tent (10 x 10)"></label>
        <label>Price per day (₦) <input type="number" id="price" min="0"></label>
        <label>Quantity available <input type="number" id="qty" min="1" value="1"></label>
        <label>Photo <input type="file" id="photo" accept="image/*"></label>
        <div class="msg" id="formMsg"></div>
        <button class="btn orange" id="saveBtn">Save rental</button>
        <button class="btn line hidden" id="cancelBtn">Cancel edit</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tkhnxedtafgcatfodpzf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LO1BtxVst1NB6pGM7mZv1w_IqpO3c4B';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);

    let rentals = [];
    let editingId = null;

    async function start() {
      const { data } = await db.auth.getSession();
      if (!data.session) { $('needLogin').classList.remove('hidden'); return; }
      $('dashView').classList.remove('hidden');
      loadRentals();
    }

    async function loadRentals() {
      const { data, error } = await db.from('rentals').select('*').order('created_at');
      if (error) { $('list').textContent = 'Could not load rentals.'; console.error(error); return; }
      rentals = data;
      renderList();
    }

    function renderList() {
      const list = $('list');
      list.innerHTML = '';
      if (!rentals.length) { list.textContent = 'No rentals yet. Add one on the right.'; return; }

      rentals.forEach(r => {
        const row = document.createElement('div');
        row.className = 'row';

        let pic;
        if (r.image_url) { pic = document.createElement('img'); pic.src = r.image_url; pic.alt = r.name; }
        else { pic = document.createElement('div'); pic.className = 'ph'; }

        const info = document.createElement('div');
        info.className = 'info';
        const nm = document.createElement('div');
        nm.textContent = r.name;
        nm.style.fontWeight = '700';
        const sm = document.createElement('small');
        sm.textContent = '₦' + Number(r.price_per_day).toLocaleString() + ' / day · ' + r.quantity + ' available';
        info.append(nm, sm);

        const toggle = document.createElement('button');
        toggle.className = 'btn line';
        toggle.textContent = r.available ? 'Available' : 'Hidden';
        toggle.onclick = async () => {
          const { error } = await db.from('rentals').update({ available: !r.available }).eq('id', r.id);
          if (error) { alert('Could not update: ' + error.message); return; }
          loadRentals();
        };

        const edit = document.createElement('button');
        edit.className = 'btn line';
        edit.textContent = 'Edit';
        edit.onclick = () => startEdit(r);

        const del = document.createElement('button');
        del.className = 'btn danger';
        del.textContent = 'Delete';
        del.onclick = async () => {
          if (!confirm('Delete "' + r.name + '"?')) return;
          const { error } = await db.from('rentals').delete().eq('id', r.id);
          if (error) { alert('Could not delete: ' + error.message); return; }
          loadRentals();
        };

        row.append(pic, info, toggle, edit, del);
        list.appendChild(row);
      });
    }

    function startEdit(r) {
      editingId = r.id;
      $('name').value = r.name;
      $('price').value = r.price_per_day;
      $('qty').value = r.quantity;
      $('photo').value = '';
      $('formTitle').textContent = 'Edit rental';
      $('saveBtn').textContent = 'Save changes';
      $('cancelBtn').classList.remove('hidden');
      $('formMsg').textContent = 'Leave the photo empty to keep the current one.';
    }

    function resetForm() {
      editingId = null;
      $('name').value = '';
      $('price').value = '';
      $('qty').value = 1;
      $('photo').value = '';
      $('formTitle').textContent = 'Add rental';
      $('saveBtn').textContent = 'Save rental';
      $('cancelBtn').classList.add('hidden');
      $('formMsg').textContent = '';
    }
    $('cancelBtn').onclick = resetForm;

    async function uploadPhoto(file) {
      const ext = file.name.split('.').pop();
      const path = Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
      const { error } = await db.storage.from('item-images').upload(path, file);
      if (error) throw error;
      return db.storage.from('item-images').getPublicUrl(path).data.publicUrl;
    }

    $('saveBtn').onclick = async () => {
      const name = $('name').value.trim();
      const price = $('price').value;
      if (!name || price === '') { $('formMsg').textContent = 'Enter a name and a price.'; return; }

      $('saveBtn').disabled = true;
      $('formMsg').textContent = 'Saving...';
      try {
        const record = { name, price_per_day: Number(price), quantity: Number($('qty').value) || 1 };
        const file = $('photo').files[0];
        if (file) record.image_url = await uploadPhoto(file);

        let result;
        if (editingId) result = await db.from('rentals').update(record).eq('id', editingId);
        else result = await db.from('rentals').insert(record);
        if (result.error) throw result.error;

        resetForm();
        loadRentals();
      } catch (e) {
        $('formMsg').textContent = 'Could not save: ' + e.message;
      }
      $('saveBtn').disabled = false;
    };

    start();
  </script>
</body>
</html>
