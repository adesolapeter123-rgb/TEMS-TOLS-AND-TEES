<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent a Tent</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #FFF7EA; color: #1B2B22; margin: 0; padding: 20px; }
    h1 { color: #1F4D3A; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header a { color: #1F4D3A; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card img, .card .ph { width: 100%; height: 130px; object-fit: cover; border-radius: 12px; background: #F5B335; }
    .card a { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #C2410C; color: #fff; font-weight: 700; text-decoration: none; }
    small { color: #5B5346; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rentals</h1>
    <a href="customer service.html">← Back to shop</a>
  </div>
  <div class="grid" id="grid">Loading...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tkhnxedtafgcatfodpzf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LO1BtxVst1NB6pGM7mZv1w_IqpO3c4B';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function load() {
      const grid = document.getElementById('grid');
      const { data, error } = await db.from('rentals').select('*').eq('available', true).order('created_at');
      if (error) { grid.textContent = 'Could not load rentals.'; console.error(error); return; }
      grid.innerHTML = '';
      if (!data.length) { grid.textContent = 'No rentals available right now.'; return; }

      data.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';

        let pic;
        if (r.image_url) { pic = document.createElement('img'); pic.src = r.image_url; pic.alt = r.name; }
        else { pic = document.createElement('div'); pic.className = 'ph'; }

        const name = document.createElement('div');
        name.textContent = r.name;
        name.style.fontWeight = '700';

        const price = document.createElement('div');
        price.textContent = '₦' + Number(r.price_per_day).toLocaleString() + ' per day';

        const stock = document.createElement('small');
        stock.textContent = r.quantity + ' available';

        const btn = document.createElement('a');
        btn.textContent = 'Request this';
        btn.href = 'book.html?rental=' + encodeURIComponent(r.name);

        card.append(pic, name, price, stock, btn);
        grid.appendChild(card);
      });
    }
    load();
  </script>
</body>
</html>
